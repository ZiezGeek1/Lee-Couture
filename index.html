<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lee's Couture — Invoicing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --ink:#1C1B1A;
  --ink-soft:#38352F;
  --cream:#FAF7F2;
  --cream-2:#F1EBE1;
  --wine:#6B1F2A;
  --wine-dark:#4A1520;
  --gold:#B8935A;
  --gold-soft:#E4D4AA;
  --stone:#8A8580;
  --stone-line:#E1DAD0;
  --paid:#3F6B4F;
  --paid-bg:#E8F0E9;
  --partial:#A8763A;
  --partial-bg:#F5EBDB;
  --due:#A23B3B;
  --due-bg:#F5E5E3;
  --bg:var(--cream);
  --surface:#FFFFFF;
  --text:var(--ink);
  --text-soft:var(--stone);
  --border:var(--stone-line);
  --shadow: 0 1px 2px rgba(28,27,26,0.06), 0 8px 24px -8px rgba(28,27,26,0.10);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#161513;
    --surface:#211F1C;
    --text:#F3EFE8;
    --text-soft:#B4ACA0;
    --border:#3A362F;
    --cream-2:#2A2723;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -8px rgba(0,0,0,0.5);
  }
}
:root[data-theme="dark"]{
  --bg:#161513;
  --surface:#211F1C;
  --text:#F3EFE8;
  --text-soft:#B4ACA0;
  --border:#3A362F;
  --cream-2:#2A2723;
  --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -8px rgba(0,0,0,0.5);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',system-ui,sans-serif;
  font-size:15px;
  line-height:1.5;
  min-height:100vh;
}
.wordmark{
  font-family:'Inter',sans-serif;
  font-weight:700;
  letter-spacing:-0.01em;
}
.logo-row{display:flex;align-items:center;gap:10px;}
.logo-badge{
  width:34px;height:34px;border-radius:8px;flex-shrink:0;
  background:linear-gradient(155deg,var(--wine),var(--wine-dark));
  color:#fff;display:flex;align-items:center;justify-content:center;
  font-family:'Inter',sans-serif;font-weight:700;font-size:13px;letter-spacing:0.01em;
}
.logo-badge.gold{background:linear-gradient(155deg,var(--gold),#8C6E3F);color:#2A2116;}
.logo-row.lg .logo-badge{width:52px;height:52px;border-radius:12px;font-size:19px;}
.app{
  display:flex;
  min-height:100vh;
}
/* Sidebar */
.sidebar{
  width:230px;
  flex-shrink:0;
  background:var(--ink);
  color:var(--cream);
  display:flex;
  flex-direction:column;
  padding:28px 20px;
  position:sticky;
  top:0;
  height:100vh;
}
.sidebar .brand{
  font-size:22px;
  color:var(--cream);
  margin:0 0 2px 2px;
  line-height:1.15;
}
.sidebar .brand-sub{
  color:var(--gold);
  font-size:11px;
  letter-spacing:0.06em;
  margin:0 0 30px 2px;
  font-weight:500;
}
.nav{display:flex;flex-direction:column;gap:2px;}
.nav button{
  all:unset;
  cursor:pointer;
  padding:11px 12px;
  border-radius:6px;
  color:#CFC8BC;
  font-size:14px;
  font-weight:500;
  display:flex;
  align-items:center;
  gap:10px;
  transition:background .15s, color .15s;
}
.nav button:hover{background:rgba(255,255,255,0.06); color:var(--cream);}
.nav button.active{background:var(--wine); color:#fff;}
.nav .dot{width:5px;height:5px;border-radius:50%;background:var(--gold);flex-shrink:0;}
.sidebar-foot{
  margin-top:auto;
  padding-top:16px;
  border-top:1px solid rgba(255,255,255,0.1);
  font-size:12px;
  color:#8B8579;
}
/* Main */
.main{flex:1;min-width:0;padding:36px 40px 80px;}
.topbar{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:28px;flex-wrap:wrap;gap:12px;}
.page-title{font-family:'Playfair Display',serif;font-weight:600;font-size:28px;margin:0;color:var(--text);}
.page-sub{color:var(--text-soft);font-size:13.5px;margin-top:4px;}
.btn{
  all:unset;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:10px 18px;
  border-radius:5px;
  font-size:13.5px;
  font-weight:600;
  transition:opacity .15s, transform .1s;
}
.btn:active{transform:scale(0.98);}
.btn-primary{background:var(--wine);color:#fff;}
.btn-primary:hover{background:var(--wine-dark);}
.btn-ghost{background:transparent;color:var(--text);border:1px solid var(--border);}
.btn-ghost:hover{background:var(--cream-2);}
.btn-gold{background:var(--gold);color:#2A2116;}
.btn-gold:hover{opacity:0.88;}
.btn-sm{padding:6px 12px;font-size:12.5px;}
.btn-danger{background:transparent;color:var(--due);border:1px solid var(--due-bg);}
.btn-danger:hover{background:var(--due-bg);}
.btn:disabled{opacity:0.5;cursor:not-allowed;}

/* Cards / grid */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px;margin-bottom:32px;}
.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:8px;
  padding:20px 22px;
  box-shadow:var(--shadow);
}
.card .k{font-size:12px;color:var(--text-soft);margin:0 0 8px;font-weight:500;}
.card .v{font-family:'Playfair Display',serif;font-size:26px;font-weight:600;margin:0;color:var(--text);}
.card .v.wine{color:var(--wine);}
.card .v.gold{color:var(--gold);}

.panel{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:8px;
  box-shadow:var(--shadow);
  overflow:hidden;
}
.panel-head{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
.panel-head h3{margin:0;font-family:'Playfair Display',serif;font-weight:600;font-size:17px;}

table{width:100%;border-collapse:collapse;font-size:13.5px;}
thead th{
  text-align:left;
  font-weight:600;
  color:var(--text-soft);
  font-size:11.5px;
  padding:12px 22px;
  border-bottom:1px solid var(--border);
}
tbody td{padding:14px 22px;border-bottom:1px solid var(--border);vertical-align:middle;}
tbody tr:last-child td{border-bottom:none;}
tbody tr.clickable{cursor:pointer;}
tbody tr.clickable:hover{background:var(--cream-2);}
.tname{font-weight:600;color:var(--text);}
.tsub{color:var(--text-soft);font-size:12px;margin-top:2px;}

.badge{
  display:inline-flex;align-items:center;gap:5px;
  padding:4px 10px;border-radius:20px;
  font-size:11.5px;font-weight:600;
}
.badge.paid{background:var(--paid-bg);color:var(--paid);}
.badge.partial{background:var(--partial-bg);color:var(--partial);}
.badge.due{background:var(--due-bg);color:var(--due);}

.empty{padding:56px 22px;text-align:center;color:var(--text-soft);}
.empty .big{font-family:'Playfair Display',serif;font-style:italic;font-size:19px;color:var(--text);margin-bottom:6px;}

/* Forms */
.field{margin-bottom:16px;}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--text-soft);margin-bottom:6px;}
.field input, .field select, .field textarea{
  width:100%;
  padding:10px 12px;
  border:1px solid var(--border);
  border-radius:5px;
  font-family:'Inter',sans-serif;
  font-size:14px;
  background:var(--surface);
  color:var(--text);
}
.field input:focus, .field select:focus, .field textarea:focus{outline:2px solid var(--gold);outline-offset:0;border-color:var(--gold);}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.hint{font-size:12px;color:var(--text-soft);margin-top:5px;}

/* Modal */
.modal-overlay{
  position:fixed;inset:0;background:rgba(28,27,26,0.5);
  display:flex;align-items:center;justify-content:center;
  z-index:100;padding:20px;
}
.modal{
  background:var(--surface);border-radius:10px;max-width:560px;width:100%;
  max-height:88vh;overflow-y:auto;box-shadow:0 24px 60px -12px rgba(0,0,0,0.35);
}
.modal-head{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
.modal-head h3{margin:0;font-family:'Playfair Display',serif;font-weight:600;font-size:19px;}
.modal-body{padding:22px 24px;}
.modal-foot{padding:16px 24px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;}
.x{all:unset;cursor:pointer;color:var(--text-soft);font-size:18px;padding:4px;}
.x:hover{color:var(--text);}

/* Line items */
.li-row{display:grid;grid-template-columns:1fr 70px 100px 32px;gap:10px;align-items:center;margin-bottom:10px;}
.li-remove{all:unset;cursor:pointer;color:var(--due);font-size:18px;text-align:center;}
.li-total-row{display:flex;justify-content:flex-end;margin-top:14px;padding-top:14px;border-top:1px solid var(--border);}
.li-total-row .amt{font-family:'Playfair Display',serif;font-size:22px;font-weight:600;}

/* Invoice document */
.doc-wrap{background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);overflow:hidden;}
.doc-actions{padding:16px 26px;border-bottom:1px solid var(--border);display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;}
.doc{padding:44px 46px;}
.doc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:34px;border-bottom:2px solid var(--ink);padding-bottom:26px;}
.doc-logo img{max-height:56px;max-width:220px;object-fit:contain;}
.doc-logo .fallback{font-family:'Inter',sans-serif;font-weight:700;font-size:24px;letter-spacing:-0.01em;color:var(--ink);}
.doc-logo .tagline{font-size:10.5px;letter-spacing:0.1em;color:var(--text-soft);margin-top:4px;}
.doc-meta{text-align:right;}
.doc-meta .inv-label{font-family:'Inter',sans-serif;font-weight:700;letter-spacing:0.08em;font-size:11px;color:var(--gold);margin:0 0 4px;}
.doc-meta .inv-num{font-size:20px;font-weight:700;margin:0 0 10px;}
.doc-meta .row{font-size:12.5px;color:var(--text-soft);}
.doc-meta .row b{color:var(--text);font-weight:600;}
.doc-parties{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-bottom:30px;}
.doc-parties .lbl{font-size:11px;letter-spacing:0.06em;color:var(--gold);font-weight:600;margin-bottom:8px;}
.doc-parties .name{font-weight:700;font-size:15px;margin-bottom:3px;}
.doc-parties .line{font-size:13px;color:var(--text-soft);}
.doc table{margin-bottom:8px;}
.doc thead th{padding:10px 4px;border-bottom:2px solid var(--ink);color:var(--text);}
.doc tbody td{padding:12px 4px;border-bottom:1px solid var(--border);}
.doc .num{text-align:right;}
.doc-totals{display:flex;justify-content:flex-end;margin-top:6px;}
.doc-totals table{width:280px;}
.doc-totals td{padding:8px 4px;border:none;font-size:13.5px;}
.doc-totals .r{text-align:right;}
.doc-totals .grand td{font-weight:700;font-size:16px;border-top:2px solid var(--ink);padding-top:12px;}
.doc-totals .bal td{font-weight:700;color:var(--due);font-size:16px;}
.doc-bottom{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:34px;padding-top:24px;border-top:1px dashed var(--border);}
.doc-bottom .lbl{font-size:11px;letter-spacing:0.06em;color:var(--gold);font-weight:600;margin-bottom:8px;}
.doc-bottom .line{font-size:13px;color:var(--text-soft);}
.pay-hist{margin-top:22px;}
.pay-hist table{font-size:12.5px;}
.pay-hist thead th{padding:8px 4px;font-size:10.5px;}
.pay-hist tbody td{padding:8px 4px;}
.doc-footer-note{margin-top:30px;font-size:11.5px;color:var(--text-soft);text-align:center;}

.status-pill{padding:6px 14px;border-radius:20px;font-size:12px;font-weight:700;letter-spacing:0.02em;}

.upload-row{display:flex;align-items:center;gap:14px;}
.logo-preview{width:64px;height:64px;border-radius:8px;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;overflow:hidden;background:var(--cream-2);flex-shrink:0;}
.logo-preview img{width:100%;height:100%;object-fit:contain;}
.file-input-wrap input[type=file]{font-size:12.5px;}
.toast{
  position:fixed;bottom:24px;right:24px;background:var(--ink);color:var(--cream);
  padding:12px 20px;border-radius:6px;font-size:13.5px;box-shadow:0 10px 30px rgba(0,0,0,0.25);
  z-index:200;opacity:0;transform:translateY(10px);transition:opacity .2s, transform .2s;pointer-events:none;
}
.toast.show{opacity:1;transform:translateY(0);}
.searchbar{display:flex;gap:10px;align-items:center;}
.searchbar input{padding:9px 12px;border:1px solid var(--border);border-radius:5px;font-size:13.5px;width:200px;background:var(--surface);color:var(--text);}
.filter-chip{all:unset;cursor:pointer;padding:7px 13px;border-radius:20px;font-size:12.5px;font-weight:600;border:1px solid var(--border);color:var(--text-soft);}
.filter-chip.active{background:var(--ink);color:var(--cream);border-color:var(--ink);}
@media print{
  .sidebar,.topbar,.doc-actions{display:none !important;}
  .main{padding:0;}
  .doc-wrap{border:none;box-shadow:none;}
}
@media (max-width: 820px){
  .app{flex-direction:column;}
  .sidebar{width:100%;height:auto;position:relative;flex-direction:row;flex-wrap:wrap;padding:16px 18px;align-items:center;}
  .sidebar .brand,.sidebar .brand-sub{margin:0;}
  .nav{flex-direction:row;flex-wrap:wrap;margin-left:auto;}
  .sidebar-foot{display:none;}
  .main{padding:22px 16px 60px;}
  .field-row{grid-template-columns:1fr;}
  .doc{padding:26px 20px;}
  .doc-top{flex-direction:column;}
  .doc-meta{text-align:left;}
  .doc-parties{grid-template-columns:1fr;}
  .cards{grid-template-columns:1fr 1fr;}
}
</style>
</head>
<body>
<div id="app" class="app"></div>
<div id="toast" class="toast"></div>

<script>
/* ---------------- Platform (Claude artifact capabilities) ---------------- */
let db = null, assetsApi = null, downloadsApi = null, platformReady = false;

async function initPlatform(){
  try{
    db = (window.claude && window.claude.use) ? await window.claude.use("db") : null;
  }catch(e){ db = null; }
  try{
    assetsApi = (window.claude && window.claude.use) ? await window.claude.use("assets") : null;
  }catch(e){ assetsApi = null; }
  try{
    downloadsApi = (window.claude && window.claude.use) ? await window.claude.use("downloads") : null;
  }catch(e){ downloadsApi = null; }
  platformReady = true;
  subscribeAll();
}

/* ---------------- App State ---------------- */
const state = {
  route: 'dashboard',
  routeParam: null,
  settings: { businessName: "Lee's Couture", phone: '', email: '', address: '', currency: 'ZAR', bankName:'', accountHolder:'', accountNumber:'', branchCode:'', logoAssetId:'', logoUrl:'' },
  settingsLoaded: false,
  customers: [],
  invoices: [],
  invoiceFilter: 'all',
  invoiceSearch: '',
};

const DEFAULTS = { businessName: "Lee's Couture", phone: '076 685 1888', email: 'lee.mbedzi@gmail.com' };

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._h);
  showToast._h = setTimeout(()=>t.classList.remove('show'), 2600);
}

function fmtMoney(n){
  n = Number(n) || 0;
  return 'R' + n.toLocaleString('en-ZA', {minimumFractionDigits:2, maximumFractionDigits:2});
}
function fmtDate(d){
  if(!d) return '—';
  const dt = new Date(d);
  if(isNaN(dt)) return d;
  return dt.toLocaleDateString('en-ZA', {day:'2-digit', month:'short', year:'numeric'});
}
function initials(name){
  const words = (name||'').trim().split(/\s+/).filter(Boolean);
  if(!words.length) return 'LC';
  if(words.length===1) return words[0].slice(0,2).toUpperCase();
  return (words[0][0]+words[1][0]).toUpperCase();
}
function todayISO(){ return new Date().toISOString().slice(0,10); }
function addMonths(iso, n){
  const d = new Date(iso);
  d.setMonth(d.getMonth()+n);
  return d.toISOString().slice(0,10);
}
function invTotal(inv){ return (inv.items||[]).reduce((s,i)=> s + (Number(i.qty)||0)*(Number(i.price)||0), 0); }
function invPaid(inv){ return (inv.payments||[]).reduce((s,p)=> s + (Number(p.amount)||0), 0); }
function invBalance(inv){ return Math.max(0, invTotal(inv) - invPaid(inv)); }
function invStatus(inv){
  const bal = invBalance(inv), paid = invPaid(inv);
  if(bal <= 0.005) return 'paid';
  if(paid > 0.005) return 'partial';
  return 'due';
}
function statusLabel(s){ return s==='paid' ? 'Paid' : s==='partial' ? 'Partial' : 'Outstanding'; }

/* ---------------- DB helpers ---------------- */
async function ensureSettingsLoaded(){
  if(!db) { state.settingsLoaded = true; render(); return; }
  try{
    const ref = db.doc('settings/business');
    ref.onSnapshot((snap)=>{
      if(snap.exists){
        state.settings = Object.assign({}, state.settings, snap.data());
      } else {
        // seed defaults on first run
        const seed = Object.assign({}, state.settings, DEFAULTS);
        ref.set(seed).catch(()=>{});
        state.settings = seed;
      }
      state.settingsLoaded = true;
      render();
    }, (err)=>{ state.settingsLoaded = true; render(); });
  }catch(e){ state.settingsLoaded = true; render(); }
}

function subscribeAll(){
  ensureSettingsLoaded();
  if(!db) { render(); return; }
  try{
    db.collection('customers').onSnapshot((qs)=>{
      state.customers = qs.docs.map(d=>Object.assign({id:d.id}, d.data()));
      render();
    });
  }catch(e){}
  try{
    db.collection('invoices').onSnapshot((qs)=>{
      state.invoices = qs.docs.map(d=>Object.assign({id:d.id}, d.data()));
      render();
    });
  }catch(e){}
}

async function saveSettings(patch){
  state.settings = Object.assign({}, state.settings, patch);
  render();
  if(db){
    try{
      await db.doc('settings/business').set(state.settings);
      showToast('Business details saved');
    }catch(e){ showToast('Could not save — try again'); }
  } else {
    showToast('Saved for this session');
  }
}

async function addCustomer(data){
  if(db){
    try{
      const ref = await db.collection('customers').add(data);
      showToast('Customer added');
      return ref.id;
    }catch(e){ showToast('Could not add customer'); return null; }
  } else {
    const id = 'local-'+Date.now();
    state.customers.push(Object.assign({id}, data));
    render();
    return id;
  }
}

async function nextInvoiceNumber(){
  const n = state.invoices.length + 1;
  return 'LC-' + String(n).padStart(4,'0');
}

async function addInvoice(inv){
  if(db){
    try{
      const ref = await db.collection('invoices').add(inv);
      showToast('Invoice created');
      return ref.id;
    }catch(e){ showToast('Could not create invoice'); return null; }
  } else {
    const id = 'local-'+Date.now();
    state.invoices.push(Object.assign({id}, inv));
    render();
    return id;
  }
}

async function recordPayment(invoiceId, payment){
  const inv = state.invoices.find(i=>i.id===invoiceId);
  if(!inv) return;
  const payments = (inv.payments||[]).concat([payment]);
  if(db){
    try{
      await db.doc('invoices/'+invoiceId).update({payments});
      showToast('Payment recorded');
    }catch(e){ showToast('Could not save payment'); }
  } else {
    inv.payments = payments;
    render();
  }
}

async function uploadLogo(file){
  if(!assetsApi){ showToast('Logo upload needs the hosted app — open the published link'); return; }
  try{
    const res = await assetsApi.upload(file);
    await saveSettings({ logoAssetId: res.id, logoUrl: res.url });
  }catch(e){
    showToast('Could not upload logo — try a PNG or JPG under 20MB');
  }
}

/* ---------------- Rendering ---------------- */
function el(html){ const d = document.createElement('div'); d.innerHTML = html.trim(); return d.firstChild; }

function nav(route, label, icon){
  const active = state.route === route ? 'active' : '';
  return `<button class="${active}" data-nav="${route}"><span class="dot"></span>${label}</button>`;
}

function render(){
  const app = document.getElementById('app');
  const logoSrc = state.settings.logoUrl ? state.settings.logoUrl : (state.settings.logoAssetId ? '/_blob/'+state.settings.logoAssetId : '');
  app.innerHTML = `
    <div class="sidebar">
      <div class="logo-row lg" style="margin-bottom:28px;">
        <div class="logo-badge">${escapeHtml(initials(state.settings.businessName))}</div>
        <div>
          <p class="brand wordmark" style="margin:0;">${escapeHtml(state.settings.businessName || "Lee's Couture")}</p>
          <p class="brand-sub" style="margin:2px 0 0;">INVOICING</p>
        </div>
      </div>
      <div class="nav">
        ${nav('dashboard','Dashboard')}
        ${nav('invoices','Invoices')}
        ${nav('customers','Customers')}
        ${nav('settings','Settings')}
      </div>
      <div class="sidebar-foot">${db ? 'Synced &amp; saved' : 'Local session'}</div>
    </div>
    <div class="main" id="main"></div>
  `;
  document.querySelectorAll('[data-nav]').forEach(b=>{
    b.addEventListener('click', ()=>{ state.route = b.dataset.nav; state.routeParam=null; render(); });
  });
  const main = document.getElementById('main');
  if(state.route==='dashboard') main.innerHTML = renderDashboard();
  else if(state.route==='invoices') main.innerHTML = renderInvoiceList();
  else if(state.route==='invoice-detail') main.innerHTML = renderInvoiceDetail(state.routeParam);
  else if(state.route==='new-invoice') main.innerHTML = renderNewInvoice();
  else if(state.route==='customers') main.innerHTML = renderCustomers();
  else if(state.route==='settings') main.innerHTML = renderSettings();
  attachRouteHandlers();
}

function escapeHtml(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function renderDashboard(){
  const totalOutstanding = state.invoices.reduce((s,i)=>s+invBalance(i),0);
  const totalPaid = state.invoices.reduce((s,i)=>s+invPaid(i),0);
  const count = state.invoices.length;
  const overdue = state.invoices.filter(i=> invStatus(i)!=='paid' && i.dueDate && i.dueDate < todayISO()).length;
  const recent = [...state.invoices].sort((a,b)=> (b.createdAt||'').localeCompare(a.createdAt||'')).slice(0,6);
  return `
    <div class="topbar">
      <div><h1 class="page-title">Dashboard</h1><div class="page-sub">A look at what's owed and what's been paid</div></div>
      <button class="btn btn-primary" data-go="new-invoice">+ New invoice</button>
    </div>
    <div class="cards">
      <div class="card"><p class="k">Outstanding balance</p><p class="v wine">${fmtMoney(totalOutstanding)}</p></div>
      <div class="card"><p class="k">Collected to date</p><p class="v">${fmtMoney(totalPaid)}</p></div>
      <div class="card"><p class="k">Invoices</p><p class="v">${count}</p></div>
      <div class="card"><p class="k">Past due date</p><p class="v ${overdue?'wine':''}">${overdue}</p></div>
    </div>
    <div class="panel">
      <div class="panel-head"><h3>Recent invoices</h3><button class="btn btn-ghost btn-sm" data-go="invoices">View all</button></div>
      ${recent.length ? `<table><thead><tr><th>Invoice</th><th>Customer</th><th>Due</th><th>Total</th><th>Status</th></tr></thead><tbody>
        ${recent.map(i=>invoiceRow(i)).join('')}
      </tbody></table>` : emptyState('No invoices yet', 'Create your first invoice to see it here.')}
    </div>
  `;
}

function invoiceRow(i){
  const s = invStatus(i);
  return `<tr class="clickable" data-open-invoice="${i.id}">
    <td class="tname">${escapeHtml(i.invoiceNumber||'—')}</td>
    <td>${escapeHtml(i.customerName||'—')}</td>
    <td>${fmtDate(i.dueDate)}</td>
    <td>${fmtMoney(invTotal(i))}</td>
    <td><span class="badge ${s}">${statusLabel(s)}</span></td>
  </tr>`;
}

function emptyState(big, small){
  return `<div class="empty"><div class="big">${big}</div><div>${small}</div></div>`;
}

function renderInvoiceList(){
  let list = state.invoices.slice();
  if(state.invoiceFilter!=='all') list = list.filter(i=> invStatus(i)===state.invoiceFilter);
  if(state.invoiceSearch){
    const q = state.invoiceSearch.toLowerCase();
    list = list.filter(i=> (i.invoiceNumber||'').toLowerCase().includes(q) || (i.customerName||'').toLowerCase().includes(q));
  }
  list.sort((a,b)=> (b.createdAt||'').localeCompare(a.createdAt||''));
  return `
    <div class="topbar">
      <div><h1 class="page-title">Invoices</h1><div class="page-sub">${state.invoices.length} total</div></div>
      <button class="btn btn-primary" data-go="new-invoice">+ New invoice</button>

      <div class="panel-head">
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <button class="filter-chip ${state.invoiceFilter==='all'?'active':''}" data-filter="all">All</button>
          <button class="filter-chip ${state.invoiceFilter==='due'?'active':''}" data-filter="due">Outstanding</button>
          <button class="filter-chip ${state.invoiceFilter==='partial'?'active':''}" data-filter="partial">Partial</button>

          <td>${escapeHtml(i.customerName||'—')}</td>
          <td>${fmtDate(i.date)}</td>
          <td>${fmtDate(i.dueDate)}</td>
          <td>${fmtMoney(invTotal(i))}</td>

/* ---------------- Event wiring ---------------- */
function attachRouteHandlers(){
  document.querySelectorAll('[data-go]').forEach(b=>{
    b.addEventListener('click', ()=>{ state.route = b.dataset.go; render(); });
  });
  document.querySelectorAll('[data-open-invoice]').forEach(r=>{
    r.addEventListener('click', ()=>{ state.route='invoice-detail'; state.routeParam=r.dataset.openInvoice; render(); });
  });
  document.querySelectorAll('[data-filter]').forEach(b=>{
    b.addEventListener('click', ()=>{ state.invoiceFilter = b.dataset.filter; render(); });
  });
  const searchInput = document.getElementById('inv-search');
  if(searchInput){
    searchInput.addEventListener('input', (e)=>{ state.invoiceSearch = e.target.value; render();
      setTimeout(()=>{ const i=document.getElementById('inv-search'); if(i){ i.focus(); i.setSelectionRange(i.value.length,i.value.length);} },0);
    });
  }

  if(state.route==='customers'){
    const addBtn = document.getElementById('add-customer-btn');
    if(addBtn) addBtn.addEventListener('click', openAddCustomerModal);
  }

  if(state.route==='settings'){
    const logoInput = document.getElementById('logo-input');
    if(logoInput) logoInput.addEventListener('change', (e)=>{
      const f = e.target.files[0];
      if(f) uploadLogo(f);
    });
    const saveBtn = document.getElementById('save-settings-btn');
    if(saveBtn) saveBtn.addEventListener('click', ()=>{
      saveSettings({
        businessName: document.getElementById('s-name').value.trim() || "Lee's Couture",
        phone: document.getElementById('s-phone').value.trim(),
        email: document.getElementById('s-email').value.trim(),
        address: document.getElementById('s-address').value.trim(),
        bankName: document.getElementById('s-bank').value.trim(),
        accountHolder: document.getElementById('s-holder').value.trim(),
        accountNumber: document.getElementById('s-acc').value.trim(),
        branchCode: document.getElementById('s-branch').value.trim(),
      });
    });
  }

  if(state.route==='new-invoice'){
    const custSel = document.getElementById('ni-customer');
    custSel.addEventListener('change', ()=>{
      document.getElementById('ni-new-customer').style.display = custSel.value==='__new__' ? 'block' : 'none';
    });
    document.getElementById('ni-add-row').addEventListener('click', ()=>{
      const wrap = document.getElementById('ni-items');
      const row = el(`<div class="li-row"><input placeholder="Description" class="li-desc"><input type="number" min="1" value="1" class="li-qty" placeholder="Qty"><input type="number" min="0" step="0.01" class="li-price" placeholder="Price"><button class="li-remove" data-remove-row>✕</button></div>`);
      wrap.appendChild(row);
      wireItemRow(row);
    });
    document.querySelectorAll('.li-row').forEach(wireItemRow);
    document.getElementById('ni-save').addEventListener('click', saveNewInvoice);
    recalcTotal();
  }
}

function wireItemRow(row){
  row.querySelectorAll('input').forEach(inp=> inp.addEventListener('input', recalcTotal));
  row.querySelector('[data-remove-row]').addEventListener('click', ()=>{
    if(document.querySelectorAll('.li-row').length>1){ row.remove(); recalcTotal(); }
  });
}
function recalcTotal(){
  let total = 0;
  document.querySelectorAll('.li-row').forEach(r=>{
    const qty = parseFloat(r.querySelector('.li-qty').value)||0;
    const price = parseFloat(r.querySelector('.li-price').value)||0;
    total += qty*price;
  });
  const t = document.getElementById('ni-total');
  if(t) t.textContent = fmtMoney(total);
}

async function saveNewInvoice(){
  const custSel = document.getElementById('ni-customer');
  let customerId = custSel.value, customerName='', customerPhone='', customerEmail='';
  if(customerId==='__new__' || !customerId){
    const name = document.getElementById('ni-c-name') ? document.getElementById('ni-c-name').value.trim() : '';
    if(!name){ showToast('Add a customer name'); return; }
    const phone = document.getElementById('ni-c-phone').value.trim();
    const email = document.getElementById('ni-c-email').value.trim();
    customerId = await addCustomer({name, phone, email});
    customerName = name; customerPhone = phone; customerEmail = email;
  } else {
    const c = state.customers.find(c=>c.id===customerId);
    if(c){ customerName=c.name; customerPhone=c.phone||''; customerEmail=c.email||''; }
  }
  const items = [];
  document.querySelectorAll('.li-row').forEach(r=>{
    const desc = r.querySelector('.li-desc').value.trim();
    const qty = parseFloat(r.querySelector('.li-qty').value)||0;
    const price = parseFloat(r.querySelector('.li-price').value)||0;
    if(desc && qty>0) items.push({desc, qty, price});
  });
  if(!items.length){ showToast('Add at least one item'); return; }
  const invoiceNumber = await nextInvoiceNumber();
  const inv = {
    invoiceNumber,
    customerId, customerName, customerPhone, customerEmail,
    date: document.getElementById('ni-date').value || todayISO(),
    dueDate: document.getElementById('ni-due').value || addMonths(todayISO(),2),
    items,
    payments: [],
    notes: document.getElementById('ni-notes').value.trim(),
    createdAt: new Date().toISOString(),
  };
  const id = await addInvoice(inv);
  if(id){ state.route='invoice-detail'; state.routeParam=id; render(); }
}

function openAddCustomerModal(){
  const overlay = el(`<div class="modal-overlay"><div class="modal">
    <div class="modal-head"><h3>Add customer</h3><button class="x" id="close-modal">✕</button></div>
    <div class="modal-body">
      <div class="field"><label>Name</label><input id="mc-name"></div>
      <div class="field"><label>Phone</label><input id="mc-phone"></div>
      <div class="field"><label>Email (optional)</label><input id="mc-email"></div>
      <div class="field"><label>Address (optional)</label><input id="mc-address"></div>
    </div>
    <div class="modal-foot"><button class="btn btn-ghost" id="cancel-modal">Cancel</button><button class="btn btn-primary" id="save-customer">Add customer</button></div>
  </div></div>`);
  document.body.appendChild(overlay);
  const close = ()=> overlay.remove();
  overlay.querySelector('#close-modal').addEventListener('click', close);
  overlay.querySelector('#cancel-modal').addEventListener('click', close);
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) close(); });
  overlay.querySelector('#save-customer').addEventListener('click', async ()=>{
    const name = document.getElementById('mc-name').value.trim();
    if(!name){ showToast('Name is required'); return; }
    await addCustomer({
      name,
      phone: document.getElementById('mc-phone').value.trim(),
      email: document.getElementById('mc-email').value.trim(),
      address: document.getElementById('mc-address').value.trim(),
    });
    close();
  });
}

/* Payment modal + PDF + print, wired after render since doc content is dynamic */
document.addEventListener('click', (e)=>{
  if(e.target && e.target.id==='record-pay-btn') openPaymentModal(state.routeParam);
  if(e.target && e.target.id==='print-btn') window.print();
  if(e.target && e.target.id==='pdf-btn') downloadInvoicePdf(state.routeParam);
});

function openPaymentModal(invoiceId){
  const inv = state.invoices.find(i=>i.id===invoiceId);
  if(!inv) return;
  const bal = invBalance(inv);
  const overlay = el(`<div class="modal-overlay"><div class="modal">
    <div class="modal-head"><h3>Record payment</h3><button class="x" id="close-modal">✕</button></div>
    <div class="modal-body">
      <div class="hint" style="margin-bottom:14px;">Balance outstanding: <b>${fmtMoney(bal)}</b></div>
      <div class="field-row">
        <div class="field"><label>Amount</label><input type="number" min="0" step="0.01" id="pay-amount" value="${bal.toFixed(2)}"></div>
        <div class="field"><label>Date</label><input type="date" id="pay-date" value="${todayISO()}"></div>
      </div>
      <div class="field"><label>Note (optional)</label><input id="pay-note" placeholder="e.g. Cash, EFT, Layby installment"></div>
    </div>
    <div class="modal-foot"><button class="btn btn-ghost" id="cancel-modal">Cancel</button><button class="btn btn-primary" id="save-payment">Save payment</button></div>
  </div></div>`);
  document.body.appendChild(overlay);
  const close = ()=> overlay.remove();
  overlay.querySelector('#close-modal').addEventListener('click', close);
  overlay.querySelector('#cancel-modal').addEventListener('click', close);
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) close(); });
  overlay.querySelector('#save-payment').addEventListener('click', async ()=>{
    const amount = parseFloat(document.getElementById('pay-amount').value)||0;
    if(amount<=0){ showToast('Enter an amount'); return; }
    await recordPayment(invoiceId, { amount, date: document.getElementById('pay-date').value||todayISO(), note: document.getElementById('pay-note').value.trim() });
    close();
  });
}

/* ---------------- PDF generation ---------------- */
async function imgToDataUrl(url){
  try{
    const res = await fetch(url);
    const blob = await res.blob();
    return await new Promise((resolve,reject)=>{
      const r = new FileReader();
      r.onload = ()=>resolve(r.result);
      r.onerror = reject;
      r.readAsDataURL(blob);
    });
  }catch(e){ return null; }
}

async function downloadInvoicePdf(invoiceId){
  const inv = state.invoices.find(i=>i.id===invoiceId);
  if(!inv) { showToast('Invoice not found'); return; }
  if(!window.jspdf){ showToast('PDF library did not load'); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:'pt', format:'a4'});
  const s = state.settings;
  const marginX = 48;
  let y = 56;
  const pageW = doc.internal.pageSize.getWidth();

  // Logo or wordmark
  let logoDataUrl = null;
  if(s.logoAssetId){
    logoDataUrl = await imgToDataUrl('/_blob/'+s.logoAssetId);
  }
  function drawFallbackLogo(){
    const init = initials(s.businessName);
    doc.setFillColor(107,31,42);
    doc.roundedRect(marginX, y-24, 30, 30, 5, 5, 'F');
    doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.setTextColor(255,255,255);
    doc.text(init, marginX+15, y-6, {align:'center'});
    doc.setFont('helvetica','bold'); doc.setFontSize(19); doc.setTextColor(28,27,26);
    doc.text(s.businessName||"Lee's Couture", marginX+40, y-3);
  }
  if(logoDataUrl){
    try{
      const props = doc.getImageProperties(logoDataUrl);
      const w = 110, h = (props.height/props.width)*110;
      doc.addImage(logoDataUrl, props.fileType, marginX, y-20, w, h);
    }catch(e){
      drawFallbackLogo();
    }
  } else {
    drawFallbackLogo();
  }
  doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(140,133,128);
  doc.text('SNEAKERS & CLOTHING', marginX, y+16);

  doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.setTextColor(184,147,90);
  doc.text('INVOICE', pageW-marginX, y-14, {align:'right'});
  doc.setFont('helvetica','bold'); doc.setFontSize(15); doc.setTextColor(28,27,26);
  doc.text(inv.invoiceNumber||'', pageW-marginX, y+4, {align:'right'});
  doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(120,115,108);
  doc.text('Issued: '+fmtDate(inv.date), pageW-marginX, y+20, {align:'right'});
  doc.text('Due: '+fmtDate(inv.dueDate), pageW-marginX, y+33, {align:'right'});

  y += 50;
  doc.setDrawColor(28,27,26); doc.setLineWidth(1.2);
  doc.line(marginX, y, pageW-marginX, y);
  y += 28;

  const colW = (pageW - marginX*2 - 24)/2;
  doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(184,147,90);
  doc.text('BILLED TO', marginX, y);
  doc.text('FROM', marginX+colW+24, y);
  doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.setTextColor(28,27,26);
  doc.text(inv.customerName||'—', marginX, y+16);
  doc.text(s.businessName||"Lee's Couture", marginX+colW+24, y+16);
  doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(120,115,108);
  doc.text(inv.customerPhone||'', marginX, y+30);
  doc.text(inv.customerEmail||'', marginX, y+43);
  doc.text(s.phone||'', marginX+colW+24, y+30);
  doc.text(s.email||'', marginX+colW+24, y+43);

  y += 66;
  doc.setFont('helvetica','bold'); doc.setFontSize(9.5); doc.setTextColor(28,27,26);
  doc.text('Item', marginX, y);
  doc.text('Qty', pageW-marginX-160, y, {align:'right'});
  doc.text('Price', pageW-marginX-80, y, {align:'right'});
  doc.text('Amount', pageW-marginX, y, {align:'right'});
  y += 8;
  doc.setDrawColor(28,27,26); doc.setLineWidth(1);
  doc.line(marginX, y, pageW-marginX, y);
  y += 16;
  doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(60,57,52);
  (inv.items||[]).forEach(it=>{
    const amt = (Number(it.qty)||0)*(Number(it.price)||0);
    doc.text(String(it.desc||''), marginX, y);
    doc.text(String(it.qty||0), pageW-marginX-160, y, {align:'right'});
    doc.text(fmtMoney(it.price), pageW-marginX-80, y, {align:'right'});
    doc.text(fmtMoney(amt), pageW-marginX, y, {align:'right'});
    y += 18;
    doc.setDrawColor(225,218,208); doc.setLineWidth(0.5);
    doc.line(marginX, y-6, pageW-marginX, y-6);
  });

  y += 10;
  const total = invTotal(inv), paid = invPaid(inv), bal = invBalance(inv);
  const totBoxX = pageW-marginX-200;
  doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(80,76,70);
  doc.text('Total', totBoxX, y); doc.text(fmtMoney(total), pageW-marginX, y, {align:'right'});
  y += 16;
  doc.text('Paid to date', totBoxX, y); doc.text(fmtMoney(paid), pageW-marginX, y, {align:'right'});
  y += 4;
  doc.setDrawColor(28,27,26); doc.line(totBoxX, y+4, pageW-marginX, y+4);
  y += 20;
  doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.setTextColor(162,59,59);
  doc.text('Balance outstanding', totBoxX, y); doc.text(fmtMoney(bal), pageW-marginX, y, {align:'right'});

  y += 34;
  if(inv.payments && inv.payments.length){
    doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(184,147,90);
    doc.text('PAYMENT HISTORY', marginX, y); y+=14;
    doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(80,76,70);
    inv.payments.forEach(p=>{
      doc.text(fmtDate(p.date)+'  —  '+fmtMoney(p.amount)+(p.note ? '  ('+p.note+')' : ''), marginX, y);
      y += 14;
    });
    y += 8;
  }

  if((s.bankName || s.accountNumber) && bal>0.005){
    doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(184,147,90);
    doc.text('PAYMENT DETAILS', marginX, y); y+=14;
    doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(60,57,52);
    doc.text(s.bankName||'', marginX, y); y+=13;
    doc.text(s.accountHolder||'', marginX, y); y+=13;
    doc.text('Acc: '+(s.accountNumber||''), marginX, y); y+=13;
    doc.text('Branch: '+(s.branchCode||''), marginX, y); y+=13;
  }

  doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(140,133,128);
  doc.text('Thank you for shopping with '+(s.businessName||"Lee's Couture"), pageW/2, 800, {align:'center'});

  const filename = (inv.invoiceNumber||'invoice')+'.pdf';
  const blob = doc.output('blob');
  if(downloadsApi){
    try{
      await downloadsApi.save({filename, data: blob});
    }catch(e){
      showToast('Download was not completed');
    }
  } else {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href=url; a.download=filename; a.click();
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
  }
}

/* ---------------- Boot ---------------- */
render();
initPlatform();
</script>
